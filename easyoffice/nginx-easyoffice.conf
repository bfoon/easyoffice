# ═══════════════════════════════════════════════════════════════════════════
# nginx — EasyOffice
#
# This is the file that decides whether messages are encrypted in transit.
# Django settings can ask for HTTPS; only this can deliver it.
#
# Two things here are easy to get wrong and silent when wrong:
#
#   1. The WebSocket location needs its own Upgrade/Connection headers. If
#      you only proxy_pass, the handshake fails and the chat silently falls
#      back to HTTP polling — which still works, so nobody notices.
#   2. proxy_set_header X-Forwarded-Proto must be set from $scheme, not
#      passed through from the client. Django trusts it for
#      SECURE_PROXY_SSL_HEADER, so a forwarded client value would let a
#      caller claim to be on HTTPS when they aren't.
#
# Install:
#   sudo cp nginx-easyoffice.conf /etc/nginx/sites-available/easyoffice
#   sudo ln -sf /etc/nginx/sites-available/easyoffice /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════════════

upstream easyoffice_app {
    # Daphne/uvicorn ASGI server. Must be ASGI — WebSockets do not work
    # through gunicorn's default WSGI worker.
    server 127.0.0.1:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Plain HTTP: redirect everything, serve only the ACME challenge ──────────
server {
    listen 80;
    listen [::]:80;
    server_name easyoffice.gm www.easyoffice.gm;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name easyoffice.gm www.easyoffice.gm;

    ssl_certificate     /etc/letsencrypt/live/easyoffice.gm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easyoffice.gm/privkey.pem;

    # TLS 1.2 and 1.3 only. 1.0 and 1.1 are broken and rejected by
    # every current browser anyway.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Django also sends HSTS; having it here means it is sent even on
    # responses Django never sees, such as static files and errors.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Chat attachments can be large; call recordings are not a thing here.
    client_max_body_size 50m;

    # ── The chat WebSocket ─────────────────────────────────────────────────
    # Everything in a conversation — messages, typing, read receipts and the
    # WebRTC signalling for calls — crosses this one socket. It inherits the
    # TLS of this server block, so it is wss:// automatically. The three
    # Upgrade headers below are what make that handshake succeed.
    location /ws/ {
        proxy_pass http://easyoffice_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # from $scheme, never the client

        # A quiet chat room sends nothing for long stretches. The default
        # 60s read timeout tears the socket down mid-conversation, and the
        # client's reconnect loop hides it — which looks like "messages
        # arrive late sometimes". Give it a day.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ── Everything else ────────────────────────────────────────────────────
    location / {
        proxy_pass http://easyoffice_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /srv/easyoffice/static/;
        expires 30d;
        access_log off;
    }

    # Chat attachments are served by Django's membership-checked view
    # (ChatMessageFileView), never straight off the filesystem. Do not add a
    # location for /media/chat_uploads/ — that would hand out every
    # attachment to anyone with the URL, including people removed from the
    # room, which is exactly what effective_file_url was changed to stop.
    location /media/ {
        alias /srv/easyoffice/media/;
        expires 7d;
        location ~ ^/media/chat_uploads/ { return 404; }
    }
}

# ═══════════════════════════════════════════════════════════════════════════
# The TURN relay needs port 443 on a DIFFERENT address
# ───────────────────────────────────────────────────────────────────────────
# coturn cannot share 443 with nginx. Give it its own IP or its own host on a
# second address, then point WEBRTC_TURN_HOSTS at it:
#
#     turns:turn.easyoffice.gm:443?transport=tcp
#
# 443/TCP is the point. A relay on the usual 3478/UDP is precisely what a
# locked-down office blocks, and TLS on 443 is indistinguishable from HTTPS
# to a middlebox. Keep the UDP listener too — ICE prefers it when it works.
#
# Confirm it with:  python manage.py turncheck
# ═══════════════════════════════════════════════════════════════════════════
