<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporarily unavailable</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f6f5; color:#17262a; padding:2rem; }
    main { max-width:440px; text-align:center; }
    h1 { font-size:1.35rem; margin:0 0 .5rem; }
    p { color:#55666a; line-height:1.55; }
    a { color:#0f5c5a; }
  </style>
</head>
<body>
  <main>
    <h1>Temporarily unavailable</h1>
    <p>{{ message }}</p>
    {% if request.user.is_authenticated %}<p><a href="{% url 'logout' %}">Sign out</a></p>{% endif %}
  </main>
</body>
</html>
