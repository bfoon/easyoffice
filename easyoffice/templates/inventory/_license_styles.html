{# Extra styling used only by the licence screens. Included from the
   extra_css block of each licence template, after {{ block.super }}. #}
<style>
  /* Term / seat meters */
  .lic-meter { height: 6px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
  .lic-meter > span { display: block; height: 100%; border-radius: 99px; background: #2563eb; }
  .lic-meter.warn  > span { background: #f59e0b; }
  .lic-meter.crit  > span { background: #e11d48; }
  .lic-meter.good  > span { background: #10b981; }
  .lic-meter-label { font-size: .68rem; color: #64748b; margin-top: 4px; display: flex; justify-content: space-between; }

  /* Countdown pill in tables */
  .lic-days { font-variant-numeric: tabular-nums; font-weight: 800; font-size: .82rem; }
  .lic-days small { display: block; font-weight: 500; font-size: .64rem; color: #94a3b8; }

  /* Money figures */
  .lic-money { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lic-money-lg { font-size: 1.25rem; font-weight: 800; color: #0f172a; letter-spacing: -.02em; }
  .lic-cur { font-size: .72rem; color: #64748b; font-weight: 600; }

  /* Masked licence key */
  .lic-key {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: .78rem; background: #f8fafc; border: 1px solid #e2e8f0;
    border-radius: 8px; padding: 6px 10px; display: inline-flex; gap: 8px;
    align-items: center; color: #0f172a; word-break: break-all;
  }

  /* Timeline of events */
  .lic-event { display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px dashed #e2e8f0; }
  .lic-event:last-child { border-bottom: 0; }
  .lic-event i {
    width: 26px; height: 26px; border-radius: 8px; background: #f1f5f9; color: #475569;
    display: flex; align-items: center; justify-content: center; font-size: .78rem; flex-shrink: 0;
  }
  .lic-event-body { min-width: 0; flex: 1; }
  .lic-event-msg  { font-size: .82rem; color: #0f172a; }
  .lic-event-meta { font-size: .68rem; color: #94a3b8; margin-top: 1px; }

  /* Form grid */
  .lic-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 720px) { .lic-grid.two { grid-template-columns: 1fr 1fr; }
                              .lic-grid.three { grid-template-columns: 1fr 1fr 1fr; } }
  .lic-field-help { font-size: .7rem; color: #94a3b8; margin-top: 3px; }
  .lic-field-error { font-size: .72rem; color: #be123c; margin-top: 3px; }
  .lic-section-title {
    font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
    font-weight: 800; color: #64748b; margin: 4px 0 10px;
  }
  .lic-check { display: flex; gap: 8px; align-items: flex-start; font-size: .84rem; color: #334155; }
  .lic-check input { margin-top: 3px; }

  /* Print — reports and the detail sheet */
  @media print {
    .inv-subnav, .inv-page-actions, .lic-noprint, .inv-add-btn { display: none !important; }
    .inv-card { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
    a[href]:after { content: ""; }
  }
</style>
